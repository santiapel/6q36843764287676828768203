name: Compilar APK Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Limpiar caché de Gradle
        run: rm -rf ~/.gradle/caches/

      - name: Preparar carpeta de distribución (webDir)
        run: |
          mkdir -p dist
          rsync -av --exclude='dist' --exclude='.git' --exclude='.github' --exclude='android' ./ dist/

      - name: Inicializar proyecto y Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Mom Coin Wallet" com.momcoin.app --web-dir dist
          npx cap add android

      - name: Sincronizar archivos HTML/JS/CSS con Android
        run: npx cap sync android

      - name: Construir archivo APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: MomCoinWallet-Debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
